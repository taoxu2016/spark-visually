# Started by hand from the Actions tab: voices, renders and cuts one episode, and attaches the 720p cut to the run.
# It uses the committed numbers (the recorded run) and never re-measures them.
name: build episode
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, for example p1_how_spark_runs/e04_cut_at_the_walls"
        required: true

permissions:
  contents: write        # to publish the cut to the "Review cuts" release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MIM_REPO: ${{ github.workspace }}/external/model-in-motion
      KOKORO_MODELS: /home/runner/tts_models
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config unzip
      - name: Fonts (Inter, Lora, JetBrains Mono)
        run: |
          F=$HOME/.local/share/fonts/mim; mkdir -p $F; cd /tmp
          curl -sSfL -o inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o inter.zip -d inter && cp inter/extras/ttf/*.ttf $F/
          curl -sSfL -o jbm.zip https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          unzip -q -o jbm.zip -d jbm && cp jbm/fonts/ttf/JetBrainsMono-{Regular,Medium,Bold}.ttf $F/
          curl -sSfL -o $F/Lora-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/lora/Lora%5Bwght%5D.ttf"
          curl -sSfL -o $F/Lora-Italic-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/lora/Lora-Italic%5Bwght%5D.ttf"
          fc-cache -f && fc-list | grep -c -E "Inter|Lora|JetBrains"
      - run: pip install -r requirements-build.txt
      - name: Voice models
        run: |
          mkdir -p $KOKORO_MODELS && cd $KOKORO_MODELS
          curl -sSfLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSfLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Voice
        working-directory: ${{ inputs.episode }}
        run: python $MIM_REPO/tools/make_voiceover.py .
      - name: Scenes
        working-directory: ${{ inputs.episode }}
        run: |
          FILE=$(ls episode/episode*.py)
          for S in $(grep -oE "^class S[0-9]{2}_[A-Za-z]+" $FILE | cut -d' ' -f2); do
            manim -qm --disable_caching --media_dir build/media $FILE $S
          done
      - name: Cut
        working-directory: ${{ inputs.episode }}
        run: python $MIM_REPO/tools/assemble.py . --quality 720p30
      - uses: actions/upload-artifact@v4
        with:
          name: cut
          path: ${{ inputs.episode }}/build/final/
      - name: Publish the cut to the "Review cuts" release (replaced on every build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=review-cuts
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --title "Review cuts" \
            --notes "720p review cuts with captions burned in, rebuilt from main by the build workflow. Each upload replaces the episode's previous cut."
          for f in ${{ inputs.episode }}/build/final/SparkVisually_*; do
            case "$f" in *softsubs*|*_narration.wav) continue ;; *.mp4|*_script.md|*.en.srt) ;; *) continue ;; esac
            gh release upload $TAG "$f" --clobber
          done
